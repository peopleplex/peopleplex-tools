<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="theme-color" content="#FF6B35" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeoplePlex — AI Business Intelligence Platform</title>
  <meta name="description"
    content="Generate a complete AI-powered business intelligence report. Customer journey analysis, psychology audit, industry analysis, and buying behavior — all in one dashboard." />
  <meta name="keywords"
    content="customer journey analysis, business intelligence, AI audit, customer psychology, industry analysis" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0A0A0F;
      font-family: 'Inter', sans-serif;
      color: #F1F5F9;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0A0A0F;
    }

    ::-webkit-scrollbar-thumb {
      background: #FF6B35;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
